; PlatformIO Project Configuration File
;
; Build environments
; ──────────────────
;   Plain transport (no encryption):
;     mock        — simulated OBD2 data, no CAN hardware
;     twai        — ESP32 native TWAI + real OBD2
;     mcp2515     — external MCP2515 SPI controller + real OBD2
;
;   AES-256-GCM static PSK (USE_SECURE_PSK):
;     mock_psk
;     twai_psk
;     mcp2515_psk
;
;   PSK handshake + HKDF session key (USE_SECURE_HANDSHAKE):
;     mock_handshake
;     twai_handshake
;
;   PSK handshake + anti-replay counter (USE_SECURE_HANDSHAKE_REPLAY):
;     mock_handshake_replay
;     twai_handshake_replay
;
; ── Secret configuration ─────────────────────────────────────────────────────
;
;   PSK environments require SECURE_PSK_HEX to be defined as a 64-char hex
;   string (32 bytes / 256-bit key).
;
;   DO NOT put your real key in this file — it is version-controlled.
;
;   Instead, create platformio_secrets.ini (already in .gitignore):
;
;     [env:mock_psk]            ; repeat for each PSK env you customise
;     build_flags =
;         ${env:mock_psk_base.build_flags}
;         -DSECURE_PSK_HEX=aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899
;
;   Or export the flag from your CI/CD pipeline:
;     export PLATFORMIO_BUILD_FLAGS="-DSECURE_PSK_HEX=<your-64-hex-chars>"
;
;   Generate a random key (Unix/macOS):
;     openssl rand -hex 32
;
;   The placeholder key below is intentionally weak — REPLACE IT.
;
; See README.md §Configuration for full details.
; ─────────────────────────────────────────────────────────────────────────────

; Optional: include your local secrets override (gitignored).
; Create platformio_secrets.ini to override SECURE_PSK_HEX per environment.
[platformio]
extra_configs = platformio_secrets.ini

; ── Native unit tests (host, no ESP32/CAN hardware) ─────────────────────────
; `pio test -e native`. Compila só o que é C++ puro (sem Arduino.h/FreeRTOS):
; o cliente ISO-TP e o núcleo da coleta (src/collector/). Os dublês ficam em
; test/support/.
[env:native]
platform    = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -I src
    -I test
    -D UNITY_INCLUDE_DOUBLE
build_src_filter =
    +<can/isotp/IsoTpClient.cpp>
    +<collector/>

; ── Shared base ───────────────────────────────────────────────────────────────
[env:base]
platform      = espressif32
board         = esp32dev
upload_port   = COM9
framework     = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino

; ── Shared secure base (extends env:base) ─────────────────────────────────────
; Excludes the other security implementation from the build and adds common flags.
; Each PSK/handshake env extends this *and* a CAN env, then merges build_flags.
[env:_secure_psk_base]
extends = env:base
build_flags =
    -DUSE_SECURE_PSK
    ; ⚠️  PLACEHOLDER KEY — override in platformio_secrets.ini before flashing!
    -DSECURE_PSK_HEX=deadbeefcafebabedeadbeefcafebabedeadbeefcafebabedeadbeefcafebabe
build_src_filter = +<*> -<connectivity/secure/handshake/> -<connectivity/secure/handshake_replay/>

[env:_secure_handshake_base]
extends = env:base
build_flags =
    -DUSE_SECURE_HANDSHAKE
    ; ⚠️  PLACEHOLDER KEY — override in platformio_secrets.ini before flashing!
    ; Long-term PSK used to authenticate the handshake (NOT the session key).
    -DSECURE_PSK_HEX=deadbeefcafebabedeadbeefcafebabedeadbeefcafebabedeadbeefcafebabe
build_src_filter = +<*> -<connectivity/secure/psk/> -<connectivity/secure/handshake_replay/>

[env:_secure_handshake_replay_base]
extends = env:base
build_flags =
    -DUSE_SECURE_HANDSHAKE_REPLAY
    ; ⚠️  PLACEHOLDER KEY — override in platformio_secrets.ini before flashing!
    ; Long-term PSK used to authenticate the handshake (NOT the session key).
    -DSECURE_PSK_HEX=deadbeefcafebabedeadbeefcafebabedeadbeefcafebabedeadbeefcafebabe
build_src_filter = +<*> -<connectivity/secure/psk/> -<connectivity/secure/handshake/>

; ── Plain transport environments ──────────────────────────────────────────────

; Simulated OBD2 data — no CAN hardware required.
[env:mock]
extends = env:base
build_flags =
    -DUSE_MOCK
build_src_filter =
    +<*>
    -<can/>
    -<obd2/real/>
    -<connectivity/secure/psk/>
    -<connectivity/secure/handshake/>
    -<connectivity/secure/handshake_replay/>

; ESP32 native TWAI (+ SN65HVD230 transceiver) + real OBD2.
[env:twai]
extends = env:base
build_flags =
    -DUSE_TWAI
    -DUSE_OBD2_REAL
build_src_filter =
    +<*>
    -<can/bus/mcp2515/>
    -<obd2/mock/>
    -<connectivity/secure/psk/>
    -<connectivity/secure/handshake/>
    -<connectivity/secure/handshake_replay/>

; External MCP2515 SPI CAN controller + real OBD2.
[env:mcp2515]
extends = env:base
build_flags =
    -DUSE_MCP2515
    -DUSE_OBD2_REAL
build_src_filter =
    +<*>
    -<can/bus/twai/>
    -<obd2/mock/>
    -<connectivity/secure/psk/>
    -<connectivity/secure/handshake/>
    -<connectivity/secure/handshake_replay/>
lib_deps =
    h2zero/NimBLE-Arduino
    autowp/autowp-mcp2515

; ── AES-256-GCM PSK environments ─────────────────────────────────────────────

[env:mock_psk]
extends = env:_secure_psk_base
build_flags =
    ${env:_secure_psk_base.build_flags}
    -DUSE_MOCK
build_src_filter =
    +<*>
    -<can/>
    -<obd2/real/>
    -<connectivity/secure/handshake/>
    -<connectivity/secure/handshake_replay/>

[env:twai_psk]
extends = env:_secure_psk_base
build_flags =
    ${env:_secure_psk_base.build_flags}
    -DUSE_TWAI
    -DUSE_OBD2_REAL
build_src_filter =
    +<*>
    -<can/bus/mcp2515/>
    -<obd2/mock/>
    -<connectivity/secure/handshake/>
    -<connectivity/secure/handshake_replay/>

[env:mcp2515_psk]
extends = env:_secure_psk_base
build_flags =
    ${env:_secure_psk_base.build_flags}
    -DUSE_MCP2515
    -DUSE_OBD2_REAL
build_src_filter =
    +<*>
    -<can/bus/twai/>
    -<obd2/mock/>
    -<connectivity/secure/handshake/>
    -<connectivity/secure/handshake_replay/>
lib_deps =
    h2zero/NimBLE-Arduino
    autowp/autowp-mcp2515

; ── Handshake environments (HKDF session key, no anti-replay) ─────────────────

[env:mock_handshake]
extends = env:_secure_handshake_base
build_flags =
    ${env:_secure_handshake_base.build_flags}
    -DUSE_MOCK
build_src_filter =
    +<*>
    -<can/>
    -<obd2/real/>
    -<connectivity/secure/psk/>
    -<connectivity/secure/handshake_replay/>

[env:twai_handshake]
extends = env:_secure_handshake_base
build_flags =
    ${env:_secure_handshake_base.build_flags}
    -DUSE_TWAI
    -DUSE_OBD2_REAL
build_src_filter =
    +<*>
    -<can/bus/mcp2515/>
    -<obd2/mock/>
    -<connectivity/secure/psk/>
    -<connectivity/secure/handshake_replay/>

; ── Handshake + anti-replay counter environments ───────────────────────────────

[env:mock_handshake_replay]
extends = env:_secure_handshake_replay_base
build_flags =
    ${env:_secure_handshake_replay_base.build_flags}
    -DUSE_MOCK
build_src_filter =
    +<*>
    -<can/>
    -<obd2/real/>
    -<connectivity/secure/psk/>
    -<connectivity/secure/handshake/>

[env:twai_handshake_replay]
extends = env:_secure_handshake_replay_base
build_flags =
    ${env:_secure_handshake_replay_base.build_flags}
    -DUSE_TWAI
    -DUSE_OBD2_REAL
build_src_filter =
    +<*>
    -<can/bus/mcp2515/>
    -<obd2/mock/>
    -<connectivity/secure/psk/>
    -<connectivity/secure/handshake/>

; ── Coleta de telemetria (USE_COLLECTOR) ──────────────────────────────────────
; Modo Coletor + Diagnóstico, log em LittleFS (2 MB) e comandos AT#.
; Ver docs/plano-coleta.md.

[env:collector_mock]
extends = env:base
board_build.partitions = partitions_collector.csv
board_build.filesystem = littlefs
build_flags =
    -DUSE_MOCK
    -DUSE_COLLECTOR
build_src_filter =
    +<*>
    -<can/>
    -<obd2/real/>
    -<connectivity/secure/>

[env:collector_twai]
extends = env:base
board_build.partitions = partitions_collector.csv
board_build.filesystem = littlefs
build_flags =
    -DUSE_TWAI
    -DUSE_OBD2_REAL
    -DUSE_COLLECTOR
build_src_filter =
    +<*>
    -<can/bus/mcp2515/>
    -<obd2/mock/>
    -<connectivity/secure/>
