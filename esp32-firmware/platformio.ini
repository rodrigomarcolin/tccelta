; PlatformIO Project Configuration File
;
; Ambientes
; ─────────
;   A camada CAN é escolhida pelo ambiente:
;     collector_mock     — OBD-II simulado, sem hardware CAN
;     collector_twai     — TWAI nativo do ESP32 (+ transceiver SN65HVD230)
;     collector_mcp2515  — controlador MCP2515 via SPI
;   Cada um tem uma variante `_debug` com os eventos de depuração na serial a
;   921600 baud (docs/debug-events.md).
;
;   Testes nativos (host, sem ESP32): `pio test -e native`.
;
; Configuração local (porta, flags de teste): copie
; platformio_local.ini.example para platformio_local.ini (fora do git).

[platformio]
default_envs  = collector_twai
extra_configs = platformio_local.ini

; ── Testes nativos (host) ─────────────────────────────────────────────────────
; Compila só o que é C++ puro (sem Arduino.h/FreeRTOS): o cliente ISO-TP, o
; núcleo da coleta (src/collector/), as primitivas e a autenticação (crypto/,
; security/ sem mbed/), o protocolo SYNC (sync/) e o núcleo do pareamento
; (connectivity/pairing/: PairButton e PairingPolicy). Os dublês ficam em test/support/.
[env:native]
platform    = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -I src
    -I test
    -D UNITY_INCLUDE_DOUBLE
    -D COLLECTOR_EVENTS
build_src_filter =
    +<can/isotp/IsoTpClient.cpp>
    +<collector/>
    +<crypto/>
    +<security/>
    -<security/mbed/>
    +<sync/>
    +<connectivity/pairing/PairButton.cpp>
    +<connectivity/pairing/PairingPolicy.cpp>

; ── Seções compartilhadas (não são ambientes) ─────────────────────────────────
[base]
platform      = espressif32@7.1.3
board         = esp32dev
; Arduino como componente do ESP-IDF: o mesmo código e o mesmo build servem a
; dev, devsec e prod (spec fase-1/01 §9). ESP-IDF 4.4.7 = linha do Arduino 2.0.17.
framework     = arduino, espidf
platform_packages = framework-espidf @ ~3.40407.0
monitor_speed = 115200
; O IDF compila com -Werror=all; as bibliotecas de terceiros (NimBLE-Arduino) não
; passam. Avisos continuam visíveis, só deixam de quebrar o build.
; Pool de mbufs do NimBLE em 24 blocos (spec fase-1/04 §7). Só vale porque o
; sdkconfig.defaults mantém o host BT do IDF em Bluedroid e o NimBLE do IDF desligado.
build_flags   =
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
build_unflags = -Werror=all
board_build.partitions = partitions_collector.csv
board_build.filesystem = littlefs
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1

; ── Pareamento BLE (Fase 2) ───────────────────────────────────────────────────
; Botão BOOT (GPIO0) segurado PAIR_BUTTON_HOLD_MS abre a janela de pareamento
; por PAIR_WINDOW_MS. Para mudar só na sua máquina, redefina [pairing] no
; platformio_local.ini (mantendo CONFIG_BT_NIMBLE_MAX_BONDS=1).
[pairing]
build_flags =
    -DPAIR_BUTTON_HOLD_MS=5000
    -DPAIR_WINDOW_MS=45000
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DMYNEWT_VAL_BLE_SM_MAX_PROCS=3

[debug]
monitor_speed = 921600
build_flags =
    -DCOLLECTOR_EVENTS
    -DSERIAL_BAUD=921600
    -DSECURITY_DEV_FIXED_KEYS

; Perfis de segurança do bloco (spec fase-1/01 §1). O padrão é hmac.
[sec_none]
build_flags = -DSECURITY_PROFILE=0
[sec_hmac]
build_flags = -DSECURITY_PROFILE=1
[sec_asym]
build_flags = -DSECURITY_PROFILE=2

; Benchmark com e sem segurança (spec fase-1/06 §7): sem o hexa do FLUSH na serial.
[bench]
build_flags = -DCOLLECTOR_EVENTS_NO_HEX

; ── Ambientes ─────────────────────────────────────────────────────────────────

[env:collector_mock]
extends = base
build_flags =
    ${base.build_flags}
    ${pairing.build_flags}
    -DUSE_MOCK
build_src_filter =
    +<*>
    -<can/>
    -<obd2/real/>

[env:collector_twai]
extends = base
build_flags =
    ${base.build_flags}
    ${pairing.build_flags}
    -DUSE_TWAI
build_src_filter =
    +<*>
    -<can/bus/mcp2515/>
    -<obd2/mock/>

[env:collector_mcp2515]
extends = base
build_flags =
    ${base.build_flags}
    ${pairing.build_flags}
    -DUSE_MCP2515
build_src_filter =
    +<*>
    -<can/bus/twai/>
    -<obd2/mock/>
lib_deps =
    ${base.lib_deps}
    autowp/autowp-mcp2515@1.3.1

[env:collector_mock_debug]
extends = env:collector_mock
monitor_speed = ${debug.monitor_speed}
build_flags =
    ${env:collector_mock.build_flags}
    ${debug.build_flags}

[env:collector_twai_debug]
extends = env:collector_twai
monitor_speed = ${debug.monitor_speed}
build_flags =
    ${env:collector_twai.build_flags}
    ${debug.build_flags}

[env:collector_mcp2515_debug]
extends = env:collector_mcp2515
monitor_speed = ${debug.monitor_speed}
build_flags =
    ${env:collector_mcp2515.build_flags}
    ${debug.build_flags}

; ── Perfis de hardware (spec fase-1/01 §8–§9) ─────────────────────────────────
; Mesmo código e mesma tabela de partições; muda só o arquivo de defaults do
; sdkconfig. Depois de editar um *.defaults, apague o sdkconfig.<env> gerado.

; Ensaio de produção em placa descartável (consome eFuse; spec 01 §10.2).
[env:collector_mock_devsec]
extends = env:collector_mock_debug
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.devsec.defaults"
board_build.encryption_key   = keys/devsec/fe_key_devsec.bin

; Produção (demonstração, irreversível; spec 01 §10.3).
[env:collector_twai_prod]
extends = env:collector_twai
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.prod.defaults"

; ── Perfis de segurança e benchmark (spec fase-1/01 §1, 06 §7) ────────────────
; Todos do perfil de hardware dev (NVS em claro nos três SECURITY_PROFILE).

[env:collector_mock_debug_none]
extends = env:collector_mock_debug
build_flags =
    ${env:collector_mock_debug.build_flags}
    ${sec_none.build_flags}

[env:collector_mock_debug_asym]
extends = env:collector_mock_debug
build_flags =
    ${env:collector_mock_debug.build_flags}
    ${sec_asym.build_flags}

[env:collector_mock_bench_none]
extends = env:collector_mock_debug
build_flags =
    ${env:collector_mock_debug.build_flags}
    ${sec_none.build_flags}
    ${bench.build_flags}

[env:collector_mock_bench_hmac]
extends = env:collector_mock_debug
build_flags =
    ${env:collector_mock_debug.build_flags}
    ${sec_hmac.build_flags}
    ${bench.build_flags}

[env:collector_mock_bench_asym]
extends = env:collector_mock_debug
build_flags =
    ${env:collector_mock_debug.build_flags}
    ${sec_asym.build_flags}
    ${bench.build_flags}

[env:collector_twai_bench_none]
extends = env:collector_twai_debug
build_flags =
    ${env:collector_twai_debug.build_flags}
    ${sec_none.build_flags}
    ${bench.build_flags}

[env:collector_twai_bench_hmac]
extends = env:collector_twai_debug
build_flags =
    ${env:collector_twai_debug.build_flags}
    ${sec_hmac.build_flags}
    ${bench.build_flags}

[env:collector_twai_bench_asym]
extends = env:collector_twai_debug
build_flags =
    ${env:collector_twai_debug.build_flags}
    ${sec_asym.build_flags}
    ${bench.build_flags}
