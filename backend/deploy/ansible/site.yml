# 1a vez (SSH so por chave, root sem login; usuario sudoer ja existente, ex.: davi):
#   run.sh site.yml -e ansible_user=davi --ask-become-pass --tags base,pki
# Depois:  run.sh site.yml
# O endurecimento do sshd (sem senha, sem root) e feito antes, fora deste playbook. Ver deploy/README.md.
- import_playbook: pki.yml

- name: Servidor base
  hosts: vps
  become: true
  tags: [base]
  tasks:
    - name: Usuario deploy
      ansible.builtin.user: { name: deploy, shell: /bin/bash, groups: sudo, append: true }

    - name: Chave SSH do deploy
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ lookup('file', '/ssh/key.pub') }}"

    - name: sudo sem senha para o deploy (necessario ao Ansible; login por senha esta desligado)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Pacotes
      ansible.builtin.apt:
        name: [ufw, fail2ban, unattended-upgrades, rsync, curl, ca-certificates]
        update_cache: true
        cache_valid_time: 3600

    - name: Swap desligado (o Vault roda com disable_mlock)
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Swap fora do fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Docker Engine (script oficial; so se ainda nao instalado)
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args: { creates: /usr/bin/docker }

    - name: deploy no grupo docker
      ansible.builtin.user: { name: deploy, groups: docker, append: true }

    - name: UFW, politica padrao
      community.general.ufw: { direction: incoming, default: deny }

    - name: UFW, portas
      community.general.ufw: { rule: allow, port: "{{ item.port }}", proto: "{{ item.proto }}" }
      loop:
        - { port: "22", proto: tcp }
        - { port: "80", proto: tcp }
        - { port: "443", proto: tcp }
        - { port: "443", proto: udp }

    - name: UFW ligado
      community.general.ufw: { state: enabled }

    - ansible.builtin.service: { name: fail2ban, state: started, enabled: true }

- name: Aplicacao
  hosts: vps
  become: true
  tags: [app]
  vars:
    pki: "{{ playbook_dir }}/.pki-local"
    certs: "{{ app_dir }}/deploy/kms/certs"
    senhas: [pg_senha_superusuario, pg_senha_dono, pg_senha_api, pg_senha_worker, pg_senha_provisionador, redis_senha]
  tasks:
    - name: Pasta da aplicacao
      ansible.builtin.file: { path: "{{ app_dir }}", state: directory, owner: deploy, group: deploy, mode: "0755" }
      tags: [codigo]

    - name: Codigo (sem segredos nem certificados; nenhuma credencial de git na VPS)
      become: false
      ansible.posix.synchronize:
        src: /work/
        dest: "{{ app_dir }}/"
        use_ssh_args: true
        rsync_opts:
          - --chmod=D755,F644
          - --exclude=.git/
          - --exclude=.env
          - --exclude=/deploy/ansible/
          - --exclude=/deploy/segredos/*
          - --exclude=/deploy/kms/certs/*
          - --exclude=/deploy/postgres/tls/*
          - --exclude=/saida/
      tags: [codigo]

    - name: Pasta do site estatico (fora do backend)
      ansible.builtin.file: { path: /opt/tccelta-site, state: directory, owner: deploy, group: deploy, mode: "0755" }
      tags: [codigo]

    - name: Site estatico (tccelta-site/ do repositorio -> /opt/tccelta-site)
      become: false
      ansible.posix.synchronize:
        src: /tccelta-site/
        dest: /opt/tccelta-site/
        delete: true
        use_ssh_args: true
        rsync_opts: ["--chmod=D755,F644"]
      tags: [codigo]

    - name: Pasta do frontend (fora da arvore do backend; o compose usa ../frontend)
      ansible.builtin.file: { path: /opt/frontend, state: directory, owner: deploy, group: deploy, mode: "0755" }
      tags: [codigo, frontend]

    - name: Frontend (frontend/ do repositorio -> /opt/frontend)
      become: false
      ansible.posix.synchronize:
        src: /frontend/
        dest: /opt/frontend/
        delete: true
        use_ssh_args: true
        rsync_opts: ["--chmod=D755,F644", "--exclude=node_modules/", "--exclude=.next/",
                     "--exclude=coverage/", "--exclude=.env*", "--exclude=*.tsbuildinfo"]
      tags: [codigo, frontend]

    - name: .env a partir do exemplo (so se nao existir)
      ansible.builtin.copy:
        src: "{{ app_dir }}/.env.example"
        dest: "{{ app_dir }}/.env"
        remote_src: true
        owner: deploy
        group: deploy
        mode: "0600"
        force: false

    - name: Valores de producao no .env
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: '^{{ item.k }}='
        line: "{{ item.k }}={{ item.v }}"
      loop:
        - { k: AMBIENTE, v: producao }
        - { k: API_REPLICAS, v: "{{ api_replicas }}" }
        - { k: API_HOST, v: "{{ api_host }}" }
        - { k: CADDYFILE, v: "{{ caddyfile }}" }
        - { k: ACME_EMAIL, v: "{{ acme_email }}" }
        - { k: BANCO_PUBLICO_IP, v: "{{ vps_ip }}" }

    # Modo proxy da Cloudflare: o Caddy so confia no CF-Connecting-IP vindo destas faixas (Caddyfile.cloudflare).
    # Baixadas a cada execucao, entao nao ha lista fixa para ficar velha. Se o download falhar, o play falha.
    - name: Faixas de IP da Cloudflare no .env (so se cloudflare_proxy)
      when: cloudflare_proxy | bool
      vars:
        cf_lista: "{{ (cf_faixas.results | map(attribute='content') | join('\n')).split() }}"
      block:
        - name: Baixa as faixas oficiais (IPv4 e IPv6)
          ansible.builtin.uri:
            url: "https://www.cloudflare.com/{{ item }}"
            return_content: true
          loop: [ips-v4, ips-v6]
          register: cf_faixas
          changed_when: false

        - name: Confere que tudo e CIDR (nada alem disso entra no .env)
          ansible.builtin.assert:
            that:
              - cf_lista | length > 0
              - cf_lista | reject('match', '^[0-9a-fA-F:.]+/[0-9]{1,3}$') | list | length == 0
            quiet: true

        - name: CF_IPS no .env
          ansible.builtin.lineinfile:
            path: "{{ app_dir }}/.env"
            regexp: '^CF_IPS='
            line: "CF_IPS={{ cf_lista | join(' ') }}"

    - name: Pasta de segredos
      ansible.builtin.file: { path: "{{ app_dir }}/deploy/segredos", state: directory, owner: deploy, group: deploy, mode: "0700" }

    - name: Pasta saida (registros de dongles; os conteineres de provisionamento rodam como 65532)
      ansible.builtin.file: { path: "{{ app_dir }}/saida", state: directory, owner: "65532", group: "65532", mode: "0750" }

    - name: Senhas geradas na VPS (uma vez; nunca sobrescritas)
      ansible.builtin.shell: umask 077 && openssl rand -hex 24 | tr -d '\n' > "{{ app_dir }}/deploy/segredos/{{ item }}"
      args: { creates: "{{ app_dir }}/deploy/segredos/{{ item }}" }
      loop: "{{ senhas }}"
      no_log: true

    - name: Arquivos vazios que o compose referencia (token de dev do Vault e do tunel; nao usados)
      ansible.builtin.copy:
        dest: "{{ app_dir }}/deploy/segredos/{{ item }}"
        content: ""
        force: false
      loop: [vault_dev_root_token, cloudflared_token]

    - name: Os conteineres leem como usuarios sem privilegio; a pasta 700 protege o host
      ansible.builtin.file: { path: "{{ app_dir }}/deploy/segredos/{{ item }}", mode: "0644", owner: deploy, group: deploy }
      loop: "{{ senhas + ['vault_dev_root_token', 'cloudflared_token'] }}"

    # --- certificados do KMS, separados por servico; as chaves das CAs nao sobem ---
    - name: Pastas de certificados
      ansible.builtin.file: { path: "{{ certs }}/{{ item }}", state: directory, owner: deploy, group: deploy, mode: "0755" }
      loop: [vault, kms, api]

    - name: Certificados do KMS
      ansible.builtin.copy:
        src: "{{ pki }}/{{ item.src }}"
        dest: "{{ certs }}/{{ item.dir }}/{{ item.src }}"
        owner: "{{ item.owner | default('deploy') }}"
        group: "{{ item.owner | default('deploy') }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - { dir: vault, src: ca.pem }
        - { dir: vault, src: vault.pem }
        - { dir: vault, src: vault-key.pem, owner: root, mode: "0600" }
        - { dir: kms, src: ca.pem }
        - { dir: kms, src: kms.pem }
        - { dir: kms, src: kms-key.pem, owner: "65532", mode: "0600" }
        - { dir: api, src: ca.pem }
        - { dir: api, src: api-cliente.pem }
        - { dir: api, src: api-cliente-key.pem, owner: "65532", mode: "0600" }
      loop_control: { label: "{{ item.dir }}/{{ item.src }}" }
      no_log: true

    - ansible.builtin.file: { path: "{{ app_dir }}/deploy/postgres/tls", state: directory, owner: deploy, group: deploy, mode: "0755" }

    - name: Certificado do Postgres (1000 = usuario postgres da imagem)
      ansible.builtin.copy:
        src: "{{ pki }}/{{ item.src }}"
        dest: "{{ app_dir }}/deploy/postgres/tls/{{ item.dst }}"
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: db-server.pem, dst: server.pem, owner: "1000", mode: "0644" }
        - { src: db-server-key.pem, dst: server-key.pem, owner: "1000", mode: "0600" }
        - { src: db-ca.pem, dst: db-ca.pem, owner: deploy, mode: "0644" }
      loop_control: { label: "{{ item.dst }}" }
      no_log: true
      notify: recarregar pg_hba

    # --- acesso do DBeaver: tag `dbeaver` troca so os IPs (pg_hba + firewall da 5432), sem rsync nem stack.yml ---
    # Com --tags o Ansible nao coleta fatos sozinho, e o script do firewall usa a interface de rede.
    - name: Fatos de rede (o script do firewall usa a interface padrao)
      ansible.builtin.setup: { gather_subset: [network] }
      tags: [dbeaver]

    - name: O banco esta rodando? (na 1a execucao ainda nao; quem o sobe e o stack.yml)
      ansible.builtin.command: "{{ compose_cmd }} ps --status running -q banco"
      args: { chdir: "{{ app_dir }}" }
      register: banco_up
      changed_when: false
      tags: [dbeaver]

    - ansible.builtin.file: { path: "{{ app_dir }}/deploy/postgres/hba", state: directory, owner: deploy, group: deploy, mode: "0755" }
      tags: [dbeaver]

    - name: pg_hba.conf (numa pasta montada inteira no contêiner)
      ansible.builtin.template: { src: pg_hba.conf.j2, dest: "{{ app_dir }}/deploy/postgres/hba/pg_hba.conf", owner: deploy, group: deploy, mode: "0644" }
      notify: recarregar pg_hba
      tags: [dbeaver]

    # --- firewall da 5432 ---
    - ansible.builtin.file: { path: /etc/tccelta, state: directory, mode: "0755" }
      tags: [dbeaver]

    - name: Lista de IPs do DBeaver
      ansible.builtin.copy:
        dest: /etc/tccelta/dbeaver-allowlist.txt
        content: "{{ dbeaver_ips | join('\n') }}\n"
        mode: "0644"
      notify: recarregar firewall do banco
      tags: [dbeaver]

    - ansible.builtin.template: { src: tccelta-db-fw.sh.j2, dest: /usr/local/sbin/tccelta-db-fw.sh, mode: "0750" }
      notify: recarregar firewall do banco
      tags: [dbeaver]

    - ansible.builtin.template: { src: tccelta-db-fw.service.j2, dest: /etc/systemd/system/tccelta-db-fw.service, mode: "0644" }
      notify: recarregar firewall do banco
      tags: [dbeaver]

    - name: Aplica agora o firewall e o pg_hba (antes das verificacoes)
      ansible.builtin.meta: flush_handlers
      tags: [dbeaver]

    # --- verificacoes: falham se o que esta no ar nao e o que foi pedido ---
    - name: Regras do firewall da 5432
      ansible.builtin.command: iptables -S TCCELTA-DB
      register: fw
      changed_when: false
      tags: [dbeaver]

    - name: Salto do DOCKER-USER para a cadeia
      ansible.builtin.command: iptables -S DOCKER-USER
      register: fw_salto
      changed_when: false
      tags: [dbeaver]

    - name: Firewall confere (um RETURN por IP, DROP no fim, salto presente)
      ansible.builtin.assert:
        that:
          - (fw.stdout_lines | select('search', ' -j RETURN$') | list | length) == (dbeaver_ips | length)
          - fw.stdout_lines | last is search(' -j DROP$')
          - fw_salto.stdout is search('TCCELTA-DB')
        fail_msg: "Firewall da 5432 diferente do esperado. Veja: sudo iptables -S TCCELTA-DB"
        quiet: true
      tags: [dbeaver]

    - name: Checksum do pg_hba.conf no host
      ansible.builtin.stat: { path: "{{ app_dir }}/deploy/postgres/hba/pg_hba.conf", checksum_algorithm: sha256 }
      register: hba_host
      tags: [dbeaver]

    - name: O que o contêiner do banco enxerga (checksum e erros de sintaxe)
      ansible.builtin.shell: |
        set -e
        {{ compose_cmd }} exec -T banco sha256sum /etc/postgresql/hba/pg_hba.conf
        {{ compose_cmd }} exec -T banco psql -U postgres -At -c "select count(*) from pg_hba_file_rules where error is not null"
      args: { chdir: "{{ app_dir }}", executable: /bin/sh }
      register: hba_cont
      changed_when: false
      when: banco_up.stdout | length > 0
      tags: [dbeaver]

    - name: pg_hba do contêiner confere (mesmo arquivo do host, sem erros)
      ansible.builtin.assert:
        that:
          - hba_cont.stdout_lines[0].split()[0] == hba_host.stat.checksum
          - hba_cont.stdout_lines[-1] == '0'
        fail_msg: "O contêiner do banco nao enxerga o pg_hba.conf novo, ou ele tem erro de sintaxe."
        quiet: true
      when: banco_up.stdout | length > 0
      tags: [dbeaver]

    - name: Vault (o unico servico que sobe nesta etapa; sobe selado)
      ansible.builtin.command: "{{ compose_cmd }} up -d vault"
      args: { chdir: "{{ app_dir }}" }
      changed_when: false

    - name: Proximo passo
      ansible.builtin.debug:
        msg: "Na VPS, rode sh /opt/tccelta/deploy/vault-prod.sh init, unseal e bootstrap (ver deploy/README.md) e depois, no PC: run.sh stack.yml"

  handlers:
    - name: recarregar firewall do banco
      ansible.builtin.systemd: { name: tccelta-db-fw, daemon_reload: true, enabled: true, state: restarted }
    - name: recarregar pg_hba
      ansible.builtin.command: "{{ compose_cmd }} exec -T banco psql -U postgres -c 'select pg_reload_conf()'"
      args: { chdir: "{{ app_dir }}" }
      when: (banco_up | default({})).stdout | default('') | length > 0    # banco parado: nada a recarregar
      changed_when: false
