# Depois do init/unseal/bootstrap do Vault:  run.sh stack.yml   (-e recriar=true apos trocar certificados)
- name: Sobe a stack
  hosts: vps
  become: true
  become_user: deploy
  vars:
    senha_dbeaver: "{{ lookup('file', playbook_dir + '/.pki-local/dbeaver_ro.senha') }}"
  tasks:
    - name: O Vault precisa estar aberto (rc 2 significa selado, volte a secao 6 do roteiro)
      ansible.builtin.command: "{{ compose_cmd }} exec -T vault vault status"
      args: { chdir: "{{ app_dir }}" }
      changed_when: false

    # Antes de parar qualquer coisa: o tempo de build nao entra no downtime.
    - name: Constroi as imagens (dashboard e ferramentas incluidos)
      ansible.builtin.command: "{{ compose_cmd }} --profile dashboard --profile ferramentas build"
      args: { chdir: "{{ app_dir }}" }
      changed_when: true

    # A migracao 00010 derruba boot.gold_pending, coluna que a API ANTIGA ainda escreve: as replicas antigas
    # precisam morrer antes do `migrar`.
    - name: Para a API e o worker antigos
      ansible.builtin.command: "{{ compose_cmd }} stop api worker"
      args: { chdir: "{{ app_dir }}" }
      changed_when: true

    - name: Migracoes
      ansible.builtin.command: "{{ compose_cmd }} run --rm migrar"
      args: { chdir: "{{ app_dir }}" }
      changed_when: true

    - name: Sobe tudo (KMS, API, worker, Caddy)
      ansible.builtin.command: "{{ compose_cmd }} up -d --wait {{ '--force-recreate vault kms api' if (recriar | default(false) | bool) else '' }}"
      args: { chdir: "{{ app_dir }}" }
      changed_when: true

    - name: Cliente de client credentials do dashboard (uma vez; o segredo fica na VPS)
      ansible.builtin.shell: |
        set -eu
        umask 077
        T=deploy/segredos/analise_cliente_secret
        {{ compose_cmd }} --profile ferramentas run --rm -T kms-ferramentas client create --id {{ frontend_client_id }} > "$T.tmp" \
          || {{ compose_cmd }} --profile ferramentas run --rm -T kms-ferramentas client rotate --id {{ frontend_client_id }} > "$T.tmp"
        [ -s "$T.tmp" ] || { echo "segredo vazio" >&2; exit 1; }
        mv "$T.tmp" "$T"
      args:
        chdir: "{{ app_dir }}"
        creates: "{{ app_dir }}/deploy/segredos/analise_cliente_secret"
      no_log: true

    - name: AUTH_SECRET do dashboard (gerado na VPS, uma vez; nunca sobrescrito)
      ansible.builtin.shell: umask 077 && openssl rand -base64 32 | tr -d '\n' > "{{ app_dir }}/deploy/segredos/frontend_auth_secret"
      args: { creates: "{{ app_dir }}/deploy/segredos/frontend_auth_secret" }
      no_log: true

    - name: Le os segredos do dashboard
      ansible.builtin.slurp: { src: "{{ app_dir }}/deploy/segredos/{{ item }}" }
      loop: [analise_cliente_secret, frontend_auth_secret]
      register: segredos_frontend
      no_log: true

    - name: .env.frontend (gerado a partir do template; nao edite a mao)
      ansible.builtin.template:
        src: frontend.env.j2
        dest: "{{ app_dir }}/.env.frontend"
        owner: deploy
        group: deploy
        mode: "0600"
      vars:
        frontend_client_secret: "{{ segredos_frontend.results[0].content | b64decode | trim }}"
        frontend_auth_secret: "{{ segredos_frontend.results[1].content | b64decode | trim }}"
      register: env_frontend
      no_log: true

    - name: Sobe o dashboard (recria se o .env.frontend mudou)
      ansible.builtin.command: "{{ compose_cmd }} up -d --wait {{ '--force-recreate' if env_frontend.changed else '' }} frontend"
      args: { chdir: "{{ app_dir }}" }
      changed_when: true

    # O Caddy monta o Caddyfile como arquivo unico (o rsync troca o inode) e roda com `admin off` (sem recarga):
    # o contêiner pode ficar com o arquivo antigo e o compose nao nota. Sem arquivo de estado: compara o que o
    # contêiner ENXERGA com o arquivo do host, e recria so o Caddy (nao toca no Vault nem na API) se diferirem.
    - name: Checksum do Caddyfile no host
      ansible.builtin.stat: { path: "{{ app_dir }}/deploy/caddy/{{ caddyfile }}", checksum_algorithm: sha256 }
      register: cf

    - name: Checksum do Caddyfile dentro do conteiner do Caddy
      ansible.builtin.command: "{{ compose_cmd }} exec -T caddy sha256sum /etc/caddy/Caddyfile"
      args: { chdir: "{{ app_dir }}" }
      register: cf_conteiner
      changed_when: false
      failed_when: false

    - name: Recria so o Caddy, se ele nao esta com o Caddyfile atual
      ansible.builtin.command: "{{ compose_cmd }} up -d --force-recreate --no-deps --wait caddy"
      args: { chdir: "{{ app_dir }}" }
      when: cf_conteiner.rc != 0 or (cf_conteiner.stdout.split() | first | default('')) != cf.stat.checksum
      changed_when: true

    - name: Papel de leitura do DBeaver (a senha vai por stdin, nao aparece em ps)
      ansible.builtin.command: "{{ compose_cmd }} exec -T banco psql -U postgres -d tccelta -v ON_ERROR_STOP=1"
      args:
        chdir: "{{ app_dir }}"
        stdin: |
          SELECT 'CREATE ROLE dbeaver_ro LOGIN IN ROLE tccelta_reader'
            WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'dbeaver_ro')\gexec
          ALTER ROLE dbeaver_ro CONNECTION LIMIT {{ dbeaver_conexoes_max }};
          \set pw '{{ senha_dbeaver }}'
          ALTER ROLE dbeaver_ro PASSWORD :'pw';
          ALTER ROLE dbeaver_ro SET default_transaction_read_only = on;
          ALTER ROLE dbeaver_ro SET statement_timeout = '30s';
      changed_when: false
      no_log: true

    - name: Estado
      ansible.builtin.command: "{{ compose_cmd }} ps"
      args: { chdir: "{{ app_dir }}" }
      changed_when: false
      register: ps

    - ansible.builtin.debug: { var: ps.stdout_lines }
