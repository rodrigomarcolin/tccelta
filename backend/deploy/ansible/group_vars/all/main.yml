# Valores comuns e derivados. IP, e-mail e IPs do DBeaver NAO ficam aqui: ficam em local.yml
# (nao versionado; modelo em local.yml.example).
# ATENCAO: o Ansible carrega os arquivos desta pasta em ordem alfabetica e o ULTIMO vence. local.yml
# vem ANTES de main.yml, entao uma variavel definida nos dois fica com o valor DESTE arquivo.
api_replicas: 2

# Dominios (nao sao segredo). Etapa 2: preenchidos. Para voltar a etapa 1 (so IP), troque por "".
dominio_api: "tccelta.malcong.com.br"
dominio_db: "tccelta.malcong.com.br"

# Derivados: sem dominio, o Caddy usa o IP e um certificado interno (Caddyfile.teste).
api_host: "{{ dominio_api | default(vps_ip, true) }}"
caddyfile: "{{ 'Caddyfile.prod' if dominio_api else 'Caddyfile.teste' }}"

# Conexoes simultaneas do papel dbeaver_ro (o DBeaver abre varias por sessao: principal, metadados, editores)
dbeaver_conexoes_max: 50

app_dir: /opt/tccelta
compose_cmd: >-
  docker compose -f compose.yaml -f compose.prodlike.yaml -f compose.prod.yaml
