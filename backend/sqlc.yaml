version: "2"
sql:
  - engine: postgresql
    schema: internal/banco/migrations
    queries: internal/banco/queries
    gen:
      go:
        package: consultas
        out: internal/banco/consultas
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        query_parameter_limit: 4
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: geography
            go_type:
              type: "[]byte"
