version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - gosec
    - sqlclosecheck
  settings:
    depguard:
      rules:
        adapter:
          files:
            - '**/internal/adapter/**'
          deny:
            - pkg: tccelta/backend/internal/usecase
              desc: adaptadores implementam portas, nao conhecem os casos de uso
            - pkg: tccelta/backend/internal/http
              desc: adaptadores nao conhecem o transporte
        banco:
          files:
            - '!**/internal/adapter/postgres/**'
            - '!**/internal/database/**'
            - '!**/cmd/**'
          deny:
            - pkg: github.com/jackc/pgx
              desc: o driver do banco so e importado por adapter/postgres, database e cmd
            - pkg: tccelta/backend/internal/database
              desc: o banco (database e dbgen) so e importado por adapter/postgres e cmd; o resto usa as portas
        domain:
          files:
            - '**/internal/domain/**'
          deny:
            - pkg: github.com/jackc/pgx
              desc: 'o dominio e puro: sem banco'
            - pkg: github.com/prometheus
              desc: 'o dominio e puro: sem metricas'
            - pkg: net/http
              desc: 'o dominio e puro: sem transporte'
            - pkg: tccelta/backend/internal/database
              desc: 'o dominio e puro: sem banco'
            - pkg: tccelta/backend/internal/port
              desc: o dominio nao conhece as portas
            - pkg: tccelta/backend/internal/usecase
              desc: o dominio nao conhece os casos de uso
            - pkg: tccelta/backend/internal/adapter
              desc: o dominio nao conhece os adaptadores
            - pkg: tccelta/backend/internal/http
              desc: o dominio nao conhece o transporte
        http:
          files:
            - '**/internal/http/**'
            - '!$test'
          deny:
            - pkg: github.com/jackc/pgx
              desc: o HTTP e so transporte
            - pkg: tccelta/backend/internal/database
              desc: o HTTP e so transporte
            - pkg: tccelta/backend/internal/adapter
              desc: o HTTP chama casos de uso e portas, nunca adaptadores
        kms-isolamento:
          list-mode: strict
          files:
            - '**/internal/kms/**'
            - '**/cmd/tccelta-kms/**'
          allow:
            - $gostd
            - github.com/prometheus
            - tccelta/backend/internal/kms
            - tccelta/backend/internal/platform/breaker
        port:
          files:
            - '**/internal/port/**'
            - '!**/internal/port/porttest/**'
          deny:
            - pkg: github.com/jackc/pgx
              desc: 'as portas sao interfaces: sem banco'
            - pkg: github.com/prometheus
              desc: 'as portas sao interfaces: sem metricas concretas'
            - pkg: net/http
              desc: as portas nao conhecem o transporte
            - pkg: tccelta/backend/internal/database
              desc: as portas nao conhecem a infraestrutura
            - pkg: tccelta/backend/internal/usecase
              desc: as portas nao conhecem os casos de uso
            - pkg: tccelta/backend/internal/adapter
              desc: as portas nao conhecem os adaptadores
            - pkg: tccelta/backend/internal/http
              desc: as portas nao conhecem o transporte
        runtime:
          files:
            - '**/internal/worker/**'
            - '**/internal/tools/**'
            - '!$test'
          deny:
            - pkg: tccelta/backend/internal/adapter
              desc: worker e ferramentas recebem as portas de cmd, nunca importam adaptadores
        sem-kms:
          files:
            - '!**/internal/kms/**'
            - '!**/cmd/tccelta-kms/**'
          deny:
            - pkg: tccelta/backend/internal/kms
              desc: o backend fala com o KMS so por HTTP (internal/adapter/kmsclient)
        usecase:
          files:
            - '**/internal/usecase/**'
            - '!$test'
          deny:
            - pkg: github.com/jackc/pgx
              desc: casos de uso acessam o banco so pelas portas de internal/port
            - pkg: github.com/prometheus
              desc: metricas so pelas portas de internal/port
            - pkg: net/http
              desc: casos de uso nao conhecem o transporte
            - pkg: tccelta/backend/internal/database
              desc: casos de uso acessam o banco so pelas portas de internal/port
            - pkg: tccelta/backend/internal/adapter
              desc: casos de uso dependem das portas, nunca dos adaptadores
            - pkg: tccelta/backend/internal/http
              desc: casos de uso nao conhecem o transporte
    gosec:
      excludes:
        # G115 (overflow em conversao de inteiros): o protocolo binario e as colunas int2/int4 do banco
        # exigem conversoes entre larguras; os valores sao limitados pelo formato (validado na borda).
        - G115
        # G703/G704 (taint analysis, novas no gosec do golangci-lint v2): caminhos e URLs vem dos
        # argumentos das CLIs (cmd/*), nao de entrada de usuario da API.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - internal/database/dbgen
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
