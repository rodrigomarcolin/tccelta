name: "Frontend: lint, tipos, testes e build"

# Só roda em PRs que tocam algo dentro de frontend/.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: eslint + tsc + prettier + vitest + next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Formatação (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Testes com cobertura (vitest)
        run: npm run test:coverage

      - name: Build (next)
        run: npm run build
        env:
          ANALISE_FONTE_DADOS: mock
          NEXT_TELEMETRY_DISABLED: "1"
