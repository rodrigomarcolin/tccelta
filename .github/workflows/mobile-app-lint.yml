name: "Mobile App: lint & format"

# Só roda em PRs que tocam algo dentro de mobile-app/ — o resto do monorepo
# (esp32-firmware/, docs/) tem seu próprio ciclo de CI, não este.
on:
  pull_request:
    paths:
      - "mobile-app/**"

concurrency:
  group: mobile-app-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze-and-format:
    name: flutter analyze + dart format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter (versão pinada em .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: dart format (falha se algum arquivo precisar reformatar)
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze (falha em qualquer apontamento)
        run: flutter analyze
