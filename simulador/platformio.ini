; PlatformIO Project Configuration File — ECUSim (Arduino Uno + MCP2515)
;
; Before uploading, check simulador/ECUSim/CANMessageHandle.ino:
;     CAN.begin(MCP_ANY, CAN_250KBPS, MCP_8MHZ)
; MCP_8MHZ/MCP_16MHZ must match the crystal actually soldered on your MCP2515
; board (Fase 0 do plano de TCC — confirmar fisicamente antes de gravar).

[platformio]
src_dir = ECUSim

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/coryjfowler/MCP_CAN_lib.git
    https://github.com/altelch/iso-tp.git
