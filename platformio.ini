; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_port = COM7
build_src_filter = -<main.cpp> +<bleLed.cpp>

[env:base]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino
;     autowp/MCP2515@^1.0.1

; ── mcp2515 ─────────────────────────────────────────────────────
; Builds with external MCP2515 SPI CAN controller + real OBD2 layer
[env:mcp2515]
extends    = env:base
build_flags =
    -DUSE_MCP2515
    -DUSE_OBD2_REAL
build_src_filter = +<*> -<can/twai/> -<obd2/mock/>

; ── twai ────────────────────────────────────────────────────────
; Builds with ESP32 native TWAI (+ SN65HVD230 transceiver) + real OBD2 layer
[env:twai]
extends    = env:base
build_flags =
    -DUSE_TWAI
    -DUSE_OBD2_REAL
build_src_filter = +<*> -<can/mcp2515/> -<obd2/mock/>

; ── mock ────────────────────────────────────────────────────────
; Builds with simulated OBD2 data; no CAN hardware required
[env:mock]
extends    = env:base
build_flags =
    -DUSE_MOCK
build_src_filter = +<*> -<can/> -<obd2/real/>
